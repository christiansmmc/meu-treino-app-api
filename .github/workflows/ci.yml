name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # Única verificação automatizada que este repositório tem: não há
      # framework de teste instalado, e `scripts/smoke.ts` exige servidor e
      # banco reais, então roda à mão antes do deploy — não aqui.
      - run: bun run typecheck
